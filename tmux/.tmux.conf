# Cambiar el prefijo principal a Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enables Vim-like movements inside copy mode - use H, J, K, L instead of arrow keys.
setw -g mode-keys vi

# Status Potition
set-option -g status-position top

# Dividir pantallas con teclas mucho más lógicas y visuales
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}" # Divide verticalmente
bind - split-window -v -c "#{pane_current_path}" # Divide horizontalmente

# ==========================================
# 1. Split Window (Uso: Prefijo (Ctrl+a) -> h/j/k/l)
# ==========================================
# -h = horizontal, -v = vertical, -b = before (izquierda/arriba)
bind h split-window -hb -c "#{pane_current_path}" # Split a la izquierda
bind j split-window -v -c "#{pane_current_path}" # Split hacia abajo
bind k split-window -vb -c "#{pane_current_path}" # Split hacia arriba
bind l split-window -h -c "#{pane_current_path}" # Split a la derecha

# ==========================================
# 2. Split Window - Move (Uso directo, sin prefijo: Ctrl+Shift+h/j/k/l)
# ==========================================
# El flag '-n' indica que el atajo funciona sin presionar el prefijo primero
bind -n C-S-h select-pane -L
bind -n C-S-j select-pane -D
bind -n C-S-k select-pane -U
bind -n C-S-l select-pane -R

# ==========================================
# 3. Split resize (Uso directo: Ctrl+Alt+Shift+h/j/k/l)
# ==========================================
# C = Ctrl, M = Meta/Alt, S = Shift
bind -n C-M-S-h resize-pane -L 1
bind -n C-M-S-j resize-pane -D 1
bind -n C-M-S-k resize-pane -U 1
bind -n C-M-S-l resize-pane -R 1

# Recargar la configuración fácilmente con: prefix + r
bind r source-file ~/.tmux.conf \; display "¡Configuración recargada!"

# Habilitar soporte para el mouse (cambiar tamaño de paneles, cambiar de ventana)
set -g mouse on

# permitir que los programas dentro de tmux cambien la forma del cursor,
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[6 q'

# --- Ajustes específicos para Ghostty y macOS ---
# Asegurar que tmux reconozca la terminal de Ghostty y soporte True Color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Decirle a Tmux que Ghostty soporta color verdadero (TrueColor)
# set -ag terminal-overrides ",xterm-ghostty:RGB"
# Habilitar características avanzadas para Ghostty (como el mouse y teclas extendidas)
set -ag terminal-features ",xterm-ghostty:mouse:extkeys"

# Habilitar integración directa con el portapapeles de macOS (OSC 52)
set -s set-clipboard on

# Empezar a contar ventanas y paneles desde 1 (no desde 0, que está muy lejos en el teclado)
set -g base-index 1
setw -g pane-base-index 1

# --- Plugins ---
# Lista de plugins a cargar
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Tema visual (Dracula)
set -g @plugin 'dracula/tmux'

set -g @dracula-colors "
# simple tomorrow night color palette
pink='#cc6666'
orange='#de935f'
yellow='#f0c574'
green='#b5bd68'
cyan='#8abdb6'
blue='#81a2be'
light_purple='#b294ba'
white='#c4c8c5'
dark_gray='#363a41'
red='#cc6666'
gray='#1d1f21'
dark_purple='#373b41'
"

set -g @dracula-show-powerline true
set -g @dracula-transparent-powerline-bg true
set -g @dracula-show-empty-plugins false
set -g @dracula-show-left-icon "  #S"

set -g @dracula-plugins "network-vpn time"
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location true
set -g @dracula-weather-hide-errors true
set -g @dracula-show-timezone false
set -g @dracula-military-time true
set -g @dracula-time-format "%F %R"
set -g @dracula-network-vpn-verbose true
set -g @dracula-network-vpn-label "󰌘 "

# ¡IMPORTANTE! Esta línea debe ir siempre al final de ~/.tmux.conf
# run '~/.tmux/plugins/tpm/tpm'
run -b "$HOME/.tmux/plugins/tpm/tpm"
