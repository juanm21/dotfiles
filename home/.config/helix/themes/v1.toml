white          = "#FFFFFF"
gray_100       = "#EDEDED"
gray_200       = "#D4D4D4"
gray_300       = "#C8C8C8"
gray_400       = "#BFBFBF"
gray_500       = "#8C8C8C"
gray_550       = "#858889"
gray_600       = "#7A7A7A"
gray_700       = "#555555"
gray_800       = "#3D4147"
gray_850       = "#2A2B2C"
gray_900       = "#202122"
gray_950       = "#191A1B"
black_dim      = "#09080F"
black          = "#00000A"

# ── Azules y Cianes ──────────────────────────────────────────────────────────
cyan_light     = "#9CDCFE"
cyan           = "#4FC1FF"
blue_light     = "#6796E6"
blue           = "#569CD6"
blue_hover     = "#2D8FE0"
blue_active    = "#007ACC"
blue_accent    = "#0078D4"
blue_bracket   = "#1F5F8A"
blue_selection = "#276782"
blue_dim       = "#1E4E62"
blue_focus     = "#2C3F4A"
blue_navy      = "#10283D"
blue_black     = "#0F0F23"

# ── Verdes y Turquesas (Teal) ────────────────────────────────────────────────
teal           = "#4EC9B0"
teal_dark      = "#001212"
green_light    = "#B5CEA8"
green_bright   = "#73C991"
green          = "#6A9955"

# ── Amarillos y Naranjas ─────────────────────────────────────────────────────
yellow_light   = "#DCDCAA"
yellow         = "#E5BA7D"
yellow_tan     = "#D7BA7D"
orange_light   = "#CE9178"
orange         = "#FFA657"
orange_bright  = "#E69F00"

# ── Rojos y Púrpuras ─────────────────────────────────────────────────────────
coral_light    = "#EF8377"
coral          = "#F48771"
red_dim        = "#D16969"
red            = "#F14C4C"
purple         = "#C586C0"
purple_indigo  = "#4B479E"
purple_dark    = "#222033"
