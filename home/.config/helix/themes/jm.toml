inherits = "jetbrains_dark"

# ─────────────────────────────────────────────────────────────────────────────
# UI principal
# ─────────────────────────────────────────────────────────────────────────────

# "ui.background" = {} # Background transparent
"ui.background"                    = { bg = "#0F1218" } 
"ui.background.separator"          = { fg = "slate_600" } # Picker separator below input line
"ui.text"                          = { fg = "text", modifiers = [] }
"ui.text.focus"                    = { fg = "blue_500" } # The currently selected line in the picker
"ui.text.inactive"                 = { fg = "stone_600" } # Same as ui.text but when the text is inactive (e.g. suggestions)
"ui.text.info"                     = { fg = "stone_300" } # The key: command text in ui.popup.info boxes
"ui.text.directory"                = { fg = "stone_500" } # Directory names in prompt completion

# Cursor
"ui.cursor"                        = { fg = "slate_800", bg = "sky_500", modifiers = ["bold"] } # Shift + c
"ui.cursor.match"                  = { fg = "white", bg = "blue", modifiers = ["bold"] } # Matching bracket etc.
# "ui.cursor.normal"                 = { fg = "white", bg = "red" }
# "ui.cursor.insert"                 = { fg = "black", bg = "orange" }
# "ui.cursor.select"                 = { fg = "black", bg = "green" }
"ui.cursor.primary"                = { fg = "white", bg = "sky_700", modifiers = ["bold"] } # Cursor with primary selection
# "ui.cursor.primary.normal"         = { fg = "white", bg = "red" }
# "ui.cursor.primary.insert"         = { fg = "black", bg = "orange" }
# "ui.cursor.primary.select"         = { fg = "black", bg = "green" }

# Selecciones
"ui.selection"                     = { bg = "blue_600" }
"ui.selection.primary"             = { bg = "blue_950" }
"ui.highlight"                     = { bg = "orange_900", modifiers = ["bold"] } # Highlighted lines in the picker preview
"ui.highlight.frameline"           = { bg = "orange_300" } # Line at which debugging execution is paused at

# Línea / columna actual
"ui.cursorline.primary"            = { bg = "gray_950" }
"ui.cursorcolumn.primary"          = { bg = "slate_800" }
"ui.cursorline.secondary"          = { bg = "slate_900" }
"ui.cursorcolumn.secondary"        = { bg = "slate_900" }

# Gutter / line numbers
"ui.linenr"                        = { fg = "gray_800"}
"ui.linenr.selected"               = { fg = "white", modifiers = ["bold"] }
"ui.gutter"                        = { } # Background transparent
"ui.gutter.selected"               = { bg = "slate_800" }

# Statusline
"ui.statusline"                    = { fg = "white", bg = "sky_950", modifiers = [] }
"ui.statusline.inactive"           = { fg = "indigo_400", bg = "indigo_900", modifiers = ["dim"] }
"ui.statusline.normal"             = { fg = "white", bg = "slate", modifiers = ["bold"] }
"ui.statusline.insert"             = { fg = "white", bg = "yellow", modifiers = ["bold"] }
"ui.statusline.select"             = { fg = "white", bg = "blue", modifiers = ["bold"] }
"ui.statusline.separator"          = { fg = "yellow_400", modifiers = ["bold"] }

# Bufferline
"ui.bufferline"                    = { fg = "gray_600", bg = "gray_900" }
"ui.bufferline.active"             = { fg = "white", bg = "blue", modifiers = ["bold"] }
"ui.bufferline.background"         = { }

# Popups / widgets / hovers
"ui.popup"                         = { fg = "text", bg = "blue_900" } # space + k
"ui.popup.info"                    = { fg = "white", bg = "blue_900", modifiers = ["bold"] } # space (title and background)
"ui.window"                        = { fg = "slate_900"} # separador de ventanas (split)
"ui.help"                          = { fg = "white", bg = "blue_900" } # Description box for commands (:)

# Menú de autocompletado
"ui.menu"                          = { fg = "slate_200", bg = "slate_800" } # Code and command completion menus
"ui.menu.selected"                 = { fg = "slate_100", bg = "blue_600", modifiers = ["bold"] } # Selected autocomplete item
"ui.menu.scroll"                   = { fg = "slate_600", bg = "zinc_800" } # fg sets thumb color, bg sets track color of scrollbar

# Picker (file picker, command palette)
"ui.picker.header"                 = { fg = "text"} # Space + b
"ui.picker.header.column"          = { fg = "slate_200", underline = { color = "slate_200"}, modifiers = ["underlined"] }
"ui.picker.header.column.active"   = { fg = "white", underline = { color = "white"}, modifiers = ["bold","underlined"] }

# Virtual / ayudas visuales
"ui.virtual.ruler"                 = { bg = "blue_dark" } # Vertical
"ui.virtual.whitespace"            = { fg = "slate_800" }
"ui.virtual.indent-guide"          = { fg = "slate_800" }
"ui.virtual.inlay-hint"            = { fg = "gray_700", modifiers = ["italic", "bold"] }
# "ui.virtual.inlay-hint.parameter"  = { fg = "gray_700", modifiers = ["italic", "bold"] }
# "ui.virtual.inlay-hint.type"       = { fg = "gray_500", modifiers = ["italic", "bold"] }
"ui.virtual.wrap"                  = { fg = "slate_800" }
"ui.virtual.jump-label"            = { fg = "slate_100", bg = "blue_800", modifiers = ["bold"] } # gw

# Debug
# "ui.debug.breakpoint"              = { fg = "red" }
# "ui.debug.active"                  = { fg = "yellow" }


# ─────────────────────────────────────────────────────────────────────────────
# Diagnostics (LSP)
# ─────────────────────────────────────────────────────────────────────────────

"warning"                          = { fg = "yellow" ,modifiers = ["italic", "bold"]}
"error"                            = { fg = "red" ,modifiers = ["italic", "bold"]}
"info"                             = { fg = "blue" ,modifiers = ["italic"]}
"hint"                             = { fg = "gray_500" ,modifiers = ["italic"]}

"diagnostic"                       = { underline = { color = "gray_700", style = "curl" } }
"diagnostic.hint"                  = { underline = { color = "gray_500", style = "dashed" } }
"diagnostic.info"                  = { underline = { color = "blue", style = "dotted" } }
"diagnostic.warning"               = { underline = { color = "yellow", style = "curl" } }
"diagnostic.error"                 = { underline = { color = "red", style = "double_line" } }
"diagnostic.unnecessary"           = { modifiers = ["dim"] }
"diagnostic.deprecated"            = { modifiers = ["crossed_out"] }


# ─────────────────────────────────────────────────────────────────────────────
# Diff / Git
# ─────────────────────────────────────────────────────────────────────────────

# "diff.plus"                        = { fg = "green_bright" }
# "diff.plus.gutter"                 = { fg = "green_bright" }
# "diff.minus"                       = { fg = "coral" }
# "diff.minus.gutter"                = { fg = "coral" }
# "diff.delta"                       = { fg = "yellow" }
# "diff.delta.gutter"                = { fg = "yellow" }
# "diff.delta.moved"                 = { fg = "purple" }


# ─────────────────────────────────────────────────────────────────────────────
# Sintaxis
# ─────────────────────────────────────────────────────────────────────────────

# Comentarios
"comment"                          = { fg = "green_800", modifiers = ["italic"] }
# "comment.line"                     = { fg = "#979696", modifiers = ["italic"] }
# "comment.block"                    = { fg = "#979696", modifiers = ["italic"] }
# "comment.block.documentation"      = { fg = "#979696", modifiers = ["italic"] }
# "comment.unused"                   = { fg = "#979696", modifiers = ["italic"] }

# Constantes
"constant"                         = { fg = "white", modifiers = ["bold"] }
# "constant.builtin"                 = { fg = "blue" }
"constant.builtin.boolean"         = { fg = "blue_400" }
# "constant.numeric"                 = { fg = "green_light" }
# "constant.numeric.integer"         = { fg = "green_light" }
# "constant.numeric.float"           = { fg = "green_light" }
# "constant.character"               = { fg = "blue" }
# "constant.character.escape"        = { fg = "yellow_tan" }
# "constant.macro"                   = { fg = "blue" }

# Strings
"string"                           = { fg = "white" }
# "string.special"                   = { fg = "orange_200" }
"string.special.path"              = { fg = "orange_100", modifiers = ["italic"] }
"string.special.url"               = { fg = "orange_200", underline = { style = "line" } }
"string.special.symbol"            = { fg = "blue_400" }
# "string.escape"                    = { fg = "yellow" }
# "string.regexp"                    = { fg = "red" }

# Keywords
"keyword"                          = { fg = "sky_500", modifiers = [] } # #596FCC
"keyword.control"                  = { fg = "orange" }
"keyword.control.conditional"      = { fg = "orange" }
"keyword.control.repeat"           = { fg = "orange" }
"keyword.control.import"           = { fg = "orange" }
"keyword.control.return"           = { fg = "orange" }
"keyword.control.exception"        = { fg = "orange" }
"keyword.operator"                 = { fg = "orange" }
"keyword.directive"                = { fg = "orange" }
"keyword.function"                 = { fg = "orange" }
"keyword.storage"                  = { fg = "orange" }
"keyword.storage.type"             = { fg = "orange" }
"keyword.storage.modifier"         = { fg = "orange" }
"keyword.coroutine"                = { fg = "orange" }

# Operadores y puntuación
"operator"                         = { fg = "green_600", modifiers = ["bold"] }
"punctuation"                      = { fg = "orange", modifiers = [] }
"punctuation.delimiter"            = { fg = "white", modifiers = ["bold"] }
"punctuation.bracket"              = { fg = "emerald_600", modifiers = ["bold"] }
"punctuation.special"              = { fg = "blue" }

# Funciones
"function"                         = { fg = "yellow_100", modifiers = ["bold"] } # "function.builtin"
"function.method"                  = { fg = "yellow_100", modifiers = ["bold"] }
"function.method.private"          = { fg = "yellow_200" }
"function.macro"                   = { fg = "yellow_300" }
"function.special"                 = { fg = "yellow_400" }

# Tags / componentes
"tag"                              = { fg = "blue" }
# "tag.builtin"                      = { fg = "blue" }
# "tag.attribute"                    = { fg = "cyan_100" }

# Variables
"variable"                         = { fg = "#DCDCDC" }
"variable.builtin"                 = { fg = "blue", modifiers = ["italic"] }
"variable.parameter"               = { fg = "text", modifiers = [] }
# "variable.other"                   = { fg = "cyan_light" }
# "variable.other.member"            = { fg = "gray_200" }
# "variable.other.member.private"    = { fg = "gray_200" }
# "variable.other.constant"          = { fg = "cyan" }

# Tipos / clases / namespaces
"type"                             = { fg = "slate_400", modifiers = [] }
"type.builtin"                     = { fg = "sky_400", modifiers = ["bold"] }
"type.parameter"                   = { fg = "text", modifiers = [] }
"type.enum"                        = { fg = "blue" }
# "type.enum.variant"                = { fg = "cyan" }
"type.interface"                   = { fg = "teal", modifiers = ["italic"] }
# "type.struct"                      = { fg = "teal" }
"constructor"                      = { fg = "teal" }

# Atributos / namespaces / labels
# "attribute"                        = { fg = "cyan_100" }
"namespace"                        = { fg = "teal" }
# "module"                           = { fg = "teal" }
# "label"                            = { fg = "gray_300" }
# "special"                          = { fg = "blue" }


# ─────────────────────────────────────────────────────────────────────────────
# Markup (Markdown / RST)
# ─────────────────────────────────────────────────────────────────────────────

"markup.heading"                   = { fg = "blue", modifiers = ["bold"] }
"markup.heading.1"                 = { fg = "blue", modifiers = ["bold"] }
"markup.heading.2"                 = { fg = "blue", modifiers = ["bold"] }
"markup.heading.3"                 = { fg = "blue", modifiers = ["bold"] }
"markup.heading.4"                 = { fg = "blue", modifiers = ["bold"] }
"markup.heading.5"                 = { fg = "blue", modifiers = ["bold"] }
"markup.heading.6"                 = { fg = "blue", modifiers = ["bold"] }
"markup.heading.marker"            = { fg = "green" }
"markup.list"                      = { fg = "blue_50" }
"markup.list.numbered"             = { fg = "blue_50" }
"markup.list.unnumbered"           = { fg = "blue_50" }
"markup.list.checked"              = { fg = "green_100" }
"markup.list.unchecked"            = { fg = "gray_500" }
"markup.bold"                      = { fg = "blue", modifiers = ["bold"] }
"markup.italic"                    = { fg = "purple", modifiers = ["italic"] }
"markup.strikethrough"             = { modifiers = ["crossed_out"] }
"markup.link"                      = { fg = "orange_100" }
"markup.link.url"                  = { fg = "orange_100", underline = { style = "line" } }
"markup.link.label"                = { fg = "blue" }
"markup.link.text"                 = { fg = "blue" }
"markup.quote"                     = { fg = "green", modifiers = ["italic"] }
"markup.raw"                       = { fg = "orange_100" }
"markup.raw.inline"                = { fg = "orange_100" }
"markup.raw.block"                 = { fg = "gray_200", bg = "blue_dark" }


